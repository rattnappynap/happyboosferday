      function drawRouletteWheel() {
        var canvas = document.getElementById("wheelcanvas");
        if (canvas.getContext) {
          var outsideRadius = 220;
          var textRadius = 180;
          var insideRadius = 150;

          ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, 500, 500);

          ctx.strokeStyle = "#000";
          ctx.lineWidth = 10;
          ctx.font = "bold 20px Arial";

          for (var i = 0; i < 26; i++) {
            var angle = startAngle + i * arc;
            ctx.fillStyle = colors[i];

            ctx.beginPath();
            ctx.arc(250, 250, outsideRadius, angle, angle + arc, false);
            ctx.arc(250, 250, insideRadius, angle + arc, angle, true);
            ctx.stroke();
            ctx.fill();

            ctx.save();
            ctx.shadowOffsetX = -1;
            ctx.shadowOffsetY = -1;
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#FFF";
            ctx.translate(
              250 + Math.cos(angle + arc / 2) * textRadius,
              250 + Math.sin(angle + arc / 2) * textRadius
            );
            ctx.rotate(angle + arc / 2 + Math.PI / 2);
            var text = number[i];
            ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
            ctx.restore();
          }

          ctx.fillStyle = "black";
          ctx.beginPath();
          ctx.moveTo(250 - 4, 250 - (outsideRadius + 5));
          ctx.lineTo(250 + 4, 250 - (outsideRadius + 5));
          ctx.lineTo(250 + 4, 250 - (outsideRadius - 5));
          ctx.lineTo(250 + 9, 250 - (outsideRadius - 5));
          ctx.lineTo(250 + 0, 250 - (outsideRadius - 13));
          ctx.lineTo(250 - 9, 250 - (outsideRadius - 5));
          ctx.lineTo(250 - 4, 250 - (outsideRadius - 5));
          ctx.lineTo(250 - 4, 250 - (outsideRadius + 5));
          ctx.fill();
        }
      }

      function getRiggedIndex() {
        var availableIndices = [];
        for (var i = 1; i <= 25; i++) {
          if (!unlockedCards.has(i)) {
            availableIndices.push(i);
          }
        }
        if (availableIndices.length === 0) {
          return 0;
        }
        return availableIndices[Math.floor(Math.random() * availableIndices.length)];
      }

      function spin() {
        if (spinTimeout) return;
        if (allCardsUnlocked && secretCardUnlocked) {
          return;
        }
        targetIndex = getRiggedIndex();
        var currentRotation = startAngle % (2 * Math.PI);
        if (currentRotation < 0) currentRotation += 2 * Math.PI;
        var targetAngle = (3 * Math.PI) / 2 - (currentRotation + targetIndex * arc + arc / 2);
        while (targetAngle < 0) {
          targetAngle += 2 * Math.PI;
        }
        var extraSpins = (5 + Math.floor(Math.random() * 5)) * 2 * Math.PI;
        totalSpinRotation = extraSpins + targetAngle;
        currentSpinStartAngle = startAngle;
        spinTime = 0;
        spinTimeTotal = 4000 + Math.random() * 1000;
        audioSpin.currentTime = 0;
        playAudioSafe(audioSpin);
        rotateWheel();
      }

      function rotateWheel() {
        spinTime += 30;
        if (spinTime >= spinTimeTotal) {
          startAngle = currentSpinStartAngle + totalSpinRotation;
          drawRouletteWheel();
          stopRotateWheel();
          return;
        }
        var t = spinTime / spinTimeTotal;
        var ease = 1 - Math.pow(1 - t, 3);
        startAngle = currentSpinStartAngle + totalSpinRotation * ease;
        drawRouletteWheel();
        spinTimeout = setTimeout(rotateWheel, 30);
      }

      function stopRotateWheel() {
        clearTimeout(spinTimeout);
        spinTimeout = null;
        audioSpin.pause();
        audioSpin.currentTime = 0;
        var index = targetIndex;
        answerIndex = index;
        document.getElementById("result").innerHTML = "Result: " + number[index];
        if (index === 0) {
          if (allCardsUnlocked && !secretCardUnlocked) {
            unlockSecretCard();
          } else {
            document.getElementById("result").innerHTML += " Wait for all cards to open!";
          }
        } else {
          unlockCard(index);
        }
      }

        var modalImg = document.getElementById("modalImage");
        var modalTitle = document.getElementById("modalTitle");
        var modalDesc = document.getElementById("modalDesc");
        modal.style.display = "block";
        modalImg.src = src;
        modalTitle.textContent = titleText || "Gallery Image";
        var match = congratsData.find((item) => item.title === titleText);
        modalDesc.innerHTML = (match && match.desc) ? match.desc : "";
        triggerFriendGifEffect();
        resetZoom();
        setupDragHandlers();
      }

      function closeModal() {
        document.getElementById("imageModal").style.display = "none";
        resetZoom();
      }

      function updateTransform() {
        var container = document.getElementById("imageContainer");
        container.style.transform = "translate(" + translateX + "px, " + translateY + "px) scale(" + currentZoom + ")";
        document.getElementById("zoomInfo").textContent = "Scale: " + Math.round(currentZoom * 100) + "%";
      }

      function zoomIn() {
        if (currentZoom < maxZoom) {
          currentZoom = Math.min(currentZoom + zoomStep, maxZoom);
          updateTransform();
        }
      }

      function zoomOut() {
        if (currentZoom > minZoom) {
          currentZoom = Math.max(currentZoom - zoomStep, minZoom);
          if (currentZoom <= 1) {
            translateX = 0;
            translateY = 0;
          }
          updateTransform();
        }
      }

      function resetZoom() {
        currentZoom = 1;
        translateX = 0;
        translateY = 0;
        updateTransform();
      }

      function setupDragHandlers() {
        var container = document.getElementById("imageContainer");
        var wrapper = document.getElementById("modalWrapper");
        wrapper.onmousedown = function (e) {
          if (currentZoom > 1) {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            container.style.cursor = "grabbing";
          }
        };
        wrapper.onmousemove = function (e) {
          if (isDragging) {
            e.preventDefault();
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
          }
        };
        wrapper.onmouseup = function () {
          isDragging = false;
          container.style.cursor = "grab";
        };
        wrapper.onmouseleave = function () {
          isDragging = false;
          container.style.cursor = "grab";
        };
      }

      document.getElementById("modalWrapper").onwheel = function (e) {
        e.preventDefault();
        if (e.deltaY < 0) zoomIn();
        else zoomOut();
      };

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          closeModal();
          closeCongrats();
        }
      });

      createCards();
      draw();
    </script>
  </body>
</html>
