<p class="textShow" id="typewriter-text">

<div id="imageModal" class="modal">
	<span class="close" onclick="closeModal()">&times;</span>
	<div class="modal-title" id="modalTitle"></div>
	<div class="modal-content-wrapper" id="modalWrapper">
		<div class="modal-image-container" id="imageContainer">
			<img class="modal-content" id="modalImage">
		</div>
	</div>
	<div class="zoom-info" id="zoomInfo">Scale: 100%</div>
	<div class="zoom-controls">
		<button class="zoom-btn" onclick="zoomOut()">−</button>
		<button class="zoom-btn" onclick="resetZoom()">⟲</button>
		<button class="zoom-btn" onclick="zoomIn()">+</button>
	</div>
</div>

<script>
    window.addEventListener('load', () => {
        startTextAnimation();
    });

    function startTextAnimation() {
        const lines = document.querySelectorAll('.text-line');
        let delay = 0;
        const lineDelay = 3000;
        const fadeDuration = 1000;

        lines.forEach((line) => {
            line.style.opacity = '0';
            line.style.transition = `opacity ${fadeDuration}ms ease-in-out`;
            
            setTimeout(() => {
                line.style.opacity = '1';
            }, delay);

            delay += lineDelay;
        });
    }
</script>

</body>
